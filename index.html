<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAC80 Sunscreen Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        textarea {
            width: 80%;
            height: 100px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>NAC80 Sunscreen Checker</h1>
    <p>Enter a sunscreen ingredient list below:</p>
    
    <textarea id="ingredientInput" placeholder="Paste your ingredients here..."></textarea>
    <br>
    <button onclick="checkIngredients()">Check Ingredients</button>
    
    <div id="output"></div>

    <script>
        function checkIngredients() {
            let input = document.getElementById("ingredientInput").value.trim();
            if (!input) {
                document.getElementById("output").innerHTML = "<p>Please enter ingredients to check.</p>";
                return;
            }
            document.getElementById("output").innerHTML = "<p>Processing... (backend logic needed)</p>";
        }
    </script>
</body>
</html>
