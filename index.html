<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAC80 Checker</title>
    <style>
        <script src="script.js"></script>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        textarea {
            width: 80%;
            height: 100px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
        }
        .results {
            text-align: left;
            display: inline-block;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .checkmark {
            color: green;
        }
        .warning {
            color: red;
        }
    </style>
</head>
<body>
    <h1>NAC80 Sunscreen Checker</h1>
    <p>Enter a sunscreen ingredient list below:</p>
    
    <textarea id="ingredientInput" placeholder="Paste your ingredients here..."></textarea>
    <br>
    <button onclick="checkIngredients()">Check Ingredients</button>
    
    <div class="results">
        <h2>Results:</h2>
        <p id="nac80Output"></p>
        <p id="fragranceOutput"></p>
        <p id="adjacentOutput"></p>
    </div>

    <script>
        async function checkIngredients() {
            let input = document.getElementById("ingredientInput").value;
            
            // Simulating backend response
            let result = await fetch(`/process?ingredients=${encodeURIComponent(input)}`)
                               .then(response => response.json());

            // Parse the response
            document.getElementById("nac80Output").innerHTML = formatOutput("NAC-80 Ingredients", result.nac80);
            document.getElementById("fragranceOutput").innerHTML = formatOutput("Fragrance Ingredients", result.fragrance);
            document.getElementById("adjacentOutput").innerHTML = formatOutput("Adjacent Ingredients", result.adjacent);
        }

        function formatOutput(title, items) {
            if (items.length > 0) {
                return `<span class="warning">⚠️ ${title} Found:</span> ${items.join(", ")}`;
            } else {
                return `<span class="checkmark">✅ No ${title.toLowerCase()} found.</span>`;
            }
        }
    </script>
</body>
</html>
