<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        textarea {
            width: 80%;
            height: 100px;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 10px auto;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            text-align: center;
            display: inline-block;
            max-width: 80%;
        }

<body>
    <h1>NAC80 Sunscreen Checker</h1>
    <p>Enter a sunscreen ingredient list below:</p>
    
    <textarea id="ingredientInput" placeholder="Paste your ingredients here...(comma-separated)"></textarea>
    <br>
    <button id="checkButton">Check Ingredients</button>
    
    <div id="output"></div>

    <script src="script.js"></script>
