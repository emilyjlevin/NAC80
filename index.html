<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAC80 Sunscreen Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .container {
            text-align: center;
            width: 60%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 14px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
        }
        button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NAC80 Sunscreen Checker</h1>
        <p>Enter a sunscreen ingredient list below:</p>
        
        <textarea id="ingredientInput" placeholder="Paste your ingredients here..."></textarea>
        <br>
        <button onclick="checkIngredients()">Check Ingredients</button>
        
        <div id="output"></div>
    </div>

    <script>
        async function checkIngredients() {
            let input = document.getElementById("ingredientInput").value;
            
            // Simulate API call or processing function
            let result = await fetch(`/process?ingredients=${encodeURIComponent(input)}`)
                               .then(response => response.text());

            document.getElementById("output").innerHTML = result;
        }
    </script>
</body>
</html>
